name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )

          print(data["project"]["version"])
          PY
          )

          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match pyproject version v${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY:    ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY:  swot-confluence-qq
          IMAGE_TAG:   ${{ github.ref_name }}
          GIT_COMMIT:  ${{ github.sha }}
        run: |
          docker build \
            --build-arg GIT_COMMIT=$GIT_COMMIT \
            --build-arg GIT_DESCRIBE=$IMAGE_TAG \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:latest
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Apply
        env:
          TF_VAR_prefix:     ${{ secrets.CONFLUENCE_PREFIX }}
          TF_VAR_registry:   ${{ steps.login-ecr.outputs.registry }}
          TF_VAR_repository: swot-confluence-qq
          TF_VAR_region:     ${{ secrets.AWS_REGION }}
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.CONFLUENCE_PREFIX }}/qq/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform apply -auto-approve